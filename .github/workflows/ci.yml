name: Offline CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHON_DOTENV_DISABLED: '1'
  INCIDENT_LENS_OFFLINE_TESTS: '1'

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.17.0
      - run: python -m ruff check src tests scripts experiments

  python:
    name: Python / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # Reliability fixtures load a frozen provider with git show.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -ra --junitxml=results/ci/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.os }}
          path: results/ci/pytest.xml
          retention-days: 7

  javascript-browser:
    name: JavaScript and Mock browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Run Mock browser acceptance
        run: python scripts/run_mock_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-browser
          path: results/ci/browser/
          retention-days: 7

  dspy-offline:
    name: DSPy optimizer contracts / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/dspy/requirements.lock
      - run: python -m pip install -e '.[dev,dspy]'
      - run: python -m pip check
      - run: python -c "from dspy import Signature; print(Signature)"
      - run: python -m pytest -q tests/dspy
