# Proposed configuration, not calibrated or execution-validated.
structured_repair_retries: 1
thinking: disabled
provider_recovery:
  enabled: true
  max_transport_retries: 2
  max_structured_repairs: 1
  max_physical_attempts_per_call: 4
  initial_backoff_seconds: 2.0
  max_backoff_seconds: 20.0
  jitter_mode: none
  reserve_verifier_requests: 0
  min_request_time_seconds: 30.0
  safety_margin_seconds: 10.0
  format_capability: json_schema
