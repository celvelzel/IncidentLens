max_rounds: 4
tool_calls_limit: 12
llm_calls_limit: 16
time_limit_seconds: 600
structured_repair_retries: 1
cache_mode: "off"

investigation:
  # Cost guard: stop searching after this many consecutive rounds in which no
  # candidate gains a cause-specific discriminator, then publish INCONCLUSIVE.
  # 5 is the smallest value that never fired on an identifiable run in either
  # measured workload (frozen WP-D peak 3, mock suite at an uncapped round
  # budget peak 4). 0 disables the guard.
  evidence_gap_rounds: 5

# Explicit opt-in; CLI --response-format and environment take precedence.
provider_recovery:
  enabled: false
  max_transport_retries: 2
  max_structured_repairs: 1
  max_physical_attempts_per_call: 4
  initial_backoff_seconds: 0.5
  max_backoff_seconds: 4.0
  jitter_mode: none
  reserve_verifier_requests: 0
  min_request_time_seconds: 5.0
  format_capability: json_object
